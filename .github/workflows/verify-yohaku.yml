name: Verify Yohaku

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-yohaku.yml"
      - "apps/web/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/verify-yohaku.yml"
      - "apps/web/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yohaku-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test migration safety code
        run: python -m unittest discover -s tests -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test WordPress conversion
        working-directory: apps/web
        run: npm run test:migration

      - name: Typecheck and build Yohaku
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run build

      - name: Read back staging
        if: github.event_name != 'pull_request'
        run: python scripts/migration/verify_public_site.py
