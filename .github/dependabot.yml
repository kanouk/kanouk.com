version: 2
updates:
  # EmDash moves quickly (0.x, roughly weekly). One grouped PR per release;
  # the Verify Yohaku workflow re-applies the admin extension points during
  # `npm ci` and fails when an anchor moved. See docs/emdash-upgrade.md.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    allow:
      - dependency-name: emdash
      - dependency-name: "@emdash-cms/*"
    groups:
      emdash:
        patterns:
          - emdash
          - "@emdash-cms/*"
    versioning-strategy: increase
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
